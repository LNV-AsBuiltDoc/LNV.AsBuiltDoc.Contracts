name: Release contracts pack

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/scripts/validate_contracts_pack.py"
      - ".github/workflows/release-pack.yml"
      - "standards/**"
      - "tech/**"
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate contracts pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate contracts
        run: python .github/scripts/validate_contracts_pack.py --repo-root .

      - name: Build and test candidate archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output contracts-pack-validation.zip HEAD standards tech
          unzip -t contracts-pack-validation.zip

  pack-and-release:
    name: Publish contracts pack
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pack
        id: build_pack
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.1
          VER="${TAG#v}"                    # e.g. 1.0.1
          ZIP="asbuiltdoc-contracts-v${VER}.zip"
          SHA="${ZIP}.sha256"
          rm -f "$ZIP" "$SHA"
          git archive --format=zip --output "$ZIP" HEAD standards tech
          sha256sum "$ZIP" | tee "$SHA"
          {
            echo "ver=$VER"
            echo "zip=$ZIP"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build_pack.outputs.zip }}
            ${{ steps.build_pack.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
